<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{fragments/layout}">

<th:block layout:fragment="mystyle">
	<link rel="stylesheet" href="static/css/communityView.css">
</th:block>
<th:block layout:fragment="main">
	<div class="container">
		<div class="contents">
			<div class="left_wrap">
				<p>커뮤니티</p>
				<ul>
					<a href="/community">
						<li class="left_wrap_btn"><span class="select_btn">자유게시판</span>
					</li>
					</a>
					<a href="#">
						<li class="left_wrap_btn"><span>오디션 정보</span></li>
					</a>
				</ul>
			</div>
			<div class="right_wrap">
				<p class="right_title">자유게시판</p>
				<div class="right_list">
					<div class="notice_wrap">
						<ul class="notice_header">
							<li th:text="${bd.getBoard_name()}"></li>
							<li th:text="${bd.getBoard_regdate()}"></li>
						</ul>
						<div class="notice_body">
							<div class="notice_body_write">
								<input type="hidden" id="boardIdx" th:value="${bd.board_idx}">
								<span style="white-space: pre-wrap !important" th:text="${bd.getBoard_contents()}"></span>
							</div>
							<div
								th:style="${not #strings.isEmpty(bd.getBoard_attachPath()) ? 'display:block' : 'display:none'}"
								class="notice_body_img">
								<img style="margin-top: 10px; max-width: 100%;"
									th:src="${bd.getBoard_attachPath()}">
							</div>
						</div>
						
						<div class="comment_list" th:each="comment : ${comment}">
							<div class="notice_body_write comment_top">
								<span class="comment_name" th:text="${comment.mem_name}"></span>
								<span class="comment_date" th:text="${comment.comment_regdate}"></span>
							</div>
							<div class="notice_body_write comment_bottom">
								<span class="comment_content" th:text="${comment.comment_content}"></span>
							</div>
						</div>
						<div th:if="${session.m} != null" class="comment_write">
							<div class="comment_box">
								<input type="text" id="commentContent">
								<input type="hidden" id="mem_idx" th:value=${session.m.mem_idx}>
								<button id="commentRegisterBtn">등록</button>
							</div>
						</div>
					</div>
				</div>
				<div>
					<a class="btn_list" href="/community">목록</a>
					<a th:if="${session.m?.mem_idx != null && bd.mem_idx == session.m.mem_idx}" id="updateBtn" class="btn_list">수정</a>
					<a th:if="${session.m?.mem_idx != null && bd.mem_idx == session.m.mem_idx}" id="deleteBtn" class="btn_list">삭제</a>
		</div>
		</div>
	</div>
</th:block>

<th:block layout:fragment="myscript">
	<script>
		$("#commentRegisterBtn").off("click").on("click", function(e) {
			let commentContent = $("#commentContent").val();
			
			if(commentContent == null || commentContent == "") {
				alert("댓글을 입력해주세요.");
				return;
			}
			
			const param = {
					"comment_content": commentContent,
					"board_idx": $("#boardIdx").val(), 
					"mem_idx": $("#mem_idx").val()
			}
			
			fetch('/api/board/registerComment', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(param)
			})
			.then(async response => {
				if (response.ok) {
					alert('댓글이 등록되었습니다.');
					location.href = '/communityView?board_idx=' + $("#boardIdx").val();
				} else {
					const errorMsg = await response.text();
					alert(errorMsg);
					}
				})
				.catch(error => {
					console.error('Error:', error);
					alert('서버와 통신 중 오류가 발생했습니다.');
				});
		});
	</script>
</th:block>
</html>
