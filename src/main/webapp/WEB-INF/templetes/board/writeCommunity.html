<!DOCTYPE html>
<html xmlns:th = "http://www.thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">

<th:block layout:fragment="mystyle">
    <link rel="stylesheet" href="static/css/writeCommunity.css">
</th:block>
<th:block layout:fragment="main">
    <div class="container">
        <div class="contents">
        	<div class="left_wrap">
                <p>커뮤니티</p>
                <ul>
                    <a href="/community">
                        <li class="left_wrap_btn">
                            <span class="select_btn">자유게시판</span>
                        </li>
                    </a>
                    <a href="#">
                        <li class="left_wrap_btn">
                            <span>오디션 정보</span>
                        </li>
                    </a>
                </ul>
            </div>
            <div class="right_wrap">
                <p class="right_title">
                    자유게시판
                </p>
                <div class="right_list">
                    <div class="board_box">
                        <div class="title_box">
                            <form name = "boardform" id="boardform" enctype="multipart/form-data" onsubmit="return false">
                                <table style="width: 100%;">
                                    <tbody>
                                    <tr>
                                        <th style="width: 15%; display:block; float: left; padding: 20px 10px; text-align: left; border-bottom: 1px solid #e2e2e2; height: 65px;">
                                            <label for="inp_title">
                                                제목
                                                <em>
                                                    <img src="static/img/ico_star.png" alt="필수">
                                                </em>
                                            </label>
                                        </th>
                                        <td
                                                style="width: 85%; display:block;float: right; border-bottom: 1px solid #e2e2e2; height: 65px; padding: 18px 10px 20px 10px;">
                                            <input type="text" id="inp_title" name="board_name"
                                                   style="width:100%; border:1px solid #e2e2e2; height: 30px; padding: 10px 10px;"
                                                   placeholder="제목을 입력해주세요.">
                                        </td>
                                    </tr>
                                    <tr>
                                        <th
                                                style="width: 15%; height: 239px; display:block; float: left; padding: 20px 10px; text-align: left;  border-bottom: 1px solid #e2e2e2; ">
                                            <label for="inp_txt">
                                                내용
                                                <em>
                                                    <img src="static/img/ico_star.png" alt="필수">
                                                </em>
                                            </label>
                                        </th>
                                        <td
                                                style="height: 239px; width: 85%; display:block;float: left; padding: 18px 10px 20px 10px;  border-bottom: 1px solid #e2e2e2;">
                                            <textarea id="inp_txt" name="board_contents" cols="60" rows="5"
                                                      style="width:100%; height: 200px; border:1px solid #e2e2e2; padding: 10px 10px;float: left; vertical-align: top; resize: none;"
                                                      placeholder="문의하실 내용을 입력해주세요."></textarea>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th
                                                style="width: 15%; display:block; float: left; padding: 20px 10px; text-align: left;">
                                            <label for="inp_file">
                                                첨부 이미지
                                            </label>
                                        </th>
                                        <td
                                                style="width: 85%; display:block;float: right; height: 65px; padding: 18px 10px 20px 10px;">
                                            <input type="file" id="inp_file" name="file"
                                                   onclick="javascript:alert('주민등록번호 등 개인정보가 포함된 파일이 첨부되지 않도록 유의하시기 바랍니다.');"
                                                   style="width:100%; height: 30px; padding: 3px 0px;">
                                            <input type="hidden" name="mem_idx" th:value="${session.m.mem_idx}">
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </form>
                        </div>
                    </div>
                </div>
                <div>
                    <div id="okbtn" class="write_btn">
                        등록
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
<th:block layout:fragment="myscript">
    <script>
    function insertCommunity() {
    	let okbtn = document.getElementById("okbtn");
    	let frm = document.boardform;
    	let board_name = frm.board_name;
    	let board_contents = frm.board_contents;
    	
        if (board_name.value.trim() === '') {
            alert('제목을 입력해주세요.');
            return;
        }
        if (board_contents.value.trim() === '') {
            alert('내용을 입력해주세요.');
            return;
        }

        if (!confirm('게시글을 등록하시겠습니까?')) {
            return;
        }

        const formData = new FormData(document.boardform);

        formData.append("board_config", "C");
        
        fetch('/api/board/registerPost', {
            method: 'POST',
            body: formData
        })
        .then(async response => {
            if (response.ok) {
                alert('게시글이 성공적으로 등록되었습니다.');
                location.href = '/community';
            } else {
                const errorMsg = await response.text();
                alert(errorMsg);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('서버와 통신 중 오류가 발생했습니다.');
        });
    }
    
    $("#okbtn").off("click").on("click", function(e) {
    	insertCommunity();
    });
    </script>
</th:block>
</html>
