<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/adminLayout}">

<th:block layout:fragment="mystyle">
    <link rel="stylesheet" href="static/css/writeStage.css">
</th:block>

<th:block layout:fragment="main">
    <div class="container">
        <div class="contents">
            <div class="right_wrap">
                <p class="right_title">공연 등록</p>
                <div class="right_list">
                    <div class="qna_box">
                        <div class="title_box">
                            <form name="boardform" id="boardform" method="post" action="/stage/api/saveStage" enctype="multipart/form-data">
                                <table>
                                    <tbody>
                                    <tr>
                                        <th class="form_th">
                                            <label for="stageName">공연 제목 <em><img src="static/img/ico_star.png" alt="필수"></em></label>
                                        </th>
                                        <td class="form_td">
                                            <input type="text" id="stageName" name="stage_name" class="inp_common" placeholder="공연 제목을 입력해주세요.">
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="form_th">
                                            <label for="stageHost">공연 주최사 <em><img src="static/img/ico_star.png" alt="필수"></em></label>
                                        </th>
                                        <td class="form_td">
                                            <input type="text" id="stageHost" name="stage_host" class="inp_common" placeholder="공연 주최사를 입력해주세요.">
                                        </td>
                                    </tr>

                                    <tr>
                                        <th class="form_th">
                                            <label for="selectTheater">장소 <em><img src="static/img/ico_star.png" alt="필수"></em></label>
                                        </th>
                                        <td class="form_td">
                                            <input style="width: 80%;" type="text" id="stageLocation" name="stage_location" class="inp_common" placeholder="공연장을 선택해주세요" readonly>
                                            <input type="hidden" name="theater_idx" id="theater_idx" value="">
                                            <div style="float: right;" id="selectTheater" class="file_custom_btn">공연장 선택</div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="form_th">
                                            <label for="stageRuntime">러닝타임 <em><img src="static/img/ico_star.png" alt="필수"></em></label>
                                        </th>
                                        <td class="form_td">
                                            <input type="number" id="stageRuntime" name="stage_runtime" class="inp_common" placeholder="분 단위로 입력 (예: 90)">
                                        </td>
                                    </tr>

                 <!--                   <tr>
                                        <th class="form_th">
                                            <label>티켓 가격 <em><img src="static/img/ico_star.png" alt="필수"></em></label>
                                        </th>
                                        <td class="form_td">
                                            <div id="price_list" class="price_list">
                                                &lt;!&ndash; 가격 항목들이 동적으로 추가됩니다 &ndash;&gt;
                                            </div>
                                            <button type="button" class="price_add_btn" id="add_price_btn">+ 가격 추가</button>
                                        </td>
                                    </tr>-->

                                    <tr>
                                        <th class="form_th">
                                            <label for="stageGrade">관람 등급 <em><img src="static/img/ico_star.png" alt="필수"></em></label>
                                        </th>
                                        <td class="form_td">
                                            <select id="stageGrade" name="stage_grade" class="inp_common">
                                                <option value="">등급을 선택해주세요</option>
                                                <option value="전체 관람가">전체 관람가</option>
                                                <option value="만 8세 이상">만 8세 이상</option>
                                                <option value="만 12세 이상">만 12세 이상</option>
                                                <option value="만 15세 이상">만 15세 이상</option>
                                                <option value="청소년 관람불가">청소년 관람불가</option>
                                            </select>
                                        </td>
                                    </tr>

                                    <tr>
                                        <th class="form_th">
                                            <label for="inp_poster">포스터 <em><img src="static/img/ico_star.png" alt="필수"></em></label>
                                        </th>
                                        <td class="form_td">
                                            <div class="file_input_wrapper">
                                                <input type="file" id="inp_poster" name="poster_file" accept="image/*">
                                                <div class="file_custom_btn">📁 포스터 이미지 선택</div>
                                                <span class="file_name" id="poster_file_name">선택된 파일 없음</span>
                                            </div>
                                            <div id="poster_preview" class="image_preview" style="display: none;">
                                                <img id="poster_preview_img" class="preview_image" alt="포스터 미리보기">
                                            </div>
                                        </td>
                                    </tr>

                                    <tr>
                                        <th class="form_th">
                                            <label for="inp_details">상세페이지<br>(이미지)</label>
                                        </th>
                                        <td class="form_td">
                                            <div class="file_input_wrapper">
                                                <input type="file" id="inp_details" name="detail_files" multiple accept="image/*">
                                                <div class="file_custom_btn">📁 상세 이미지 선택 (여러장)</div>
                                            </div>
                                            <p style="margin-top: 10px;">* Ctrl 또는 Shift 키를 눌러 여러 장의 이미지를 선택할 수 있습니다.</p>
                                            <div id="detail_images_container" class="detail_images_container"></div>
                                            <p class="drag_hint">💡 이미지를 드래그하여 순서를 변경할 수 있습니다.</p>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="form_th">
                                            <label for="stageInfo">공연 설명 <em><img src="static/img/ico_star.png" alt="필수"></em></label>
                                        </th>
                                        <td class="form_td">
                                            <input type="text" id="stageInfo" name="stage_info" class="inp_common" placeholder="공연의 한 줄 설명 문구를 입력해주세요.">
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </form>
                        </div>
                    </div>
                </div>
                <div id="okbtn" class="write_btn">등록하기</div>
            </div>
        </div>
    </div>
    <div id="theaterModal" class="modal_overlay" style="display: none;">
        <div class="modal_content">
            <div class="modal_header">
                <h3>공연장 선택</h3>
                <span class="close_btn" onclick="closeModal()">×</span>
            </div>
            <div class="modal_body">
                <div class="modal_search">
                    <input type="text" id="theaterSearch" class="inp_common" placeholder="공연장 이름 검색">
                </div>
                <ul id="theaterList" class="theater_list">
                </ul>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="myscript">
    <script>
        document.getElementById('inp_poster').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const fileNameSpan = document.getElementById('poster_file_name');
            const preview = document.getElementById('poster_preview');
            const previewImg = document.getElementById('poster_preview_img');

            if (file) {
                fileNameSpan.textContent = file.name;

                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                fileNameSpan.textContent = '선택된 파일 없음';
                preview.style.display = 'none';
            }
        });

        let detailImages = [];
        let draggedElement = null;

        document.getElementById('inp_details').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            const container = document.getElementById('detail_images_container');

            files.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageData = {
                        file: file,
                        dataUrl: e.target.result,
                        id: Date.now() + index
                    };
                    detailImages.push(imageData);
                    renderDetailImages();
                };
                reader.readAsDataURL(file);
            });
        });

        function renderDetailImages() {
            const container = document.getElementById('detail_images_container');
            container.innerHTML = '';

            detailImages.forEach((img, index) => {
                const div = document.createElement('div');
                div.className = 'detail_image_item';
                div.draggable = true;
                div.dataset.id = img.id;
                div.innerHTML = `
                    <div class="detail_image_order">${index + 1}</div>
                    <img src="${img.dataUrl}" alt="상세 이미지 ${index + 1}">
                    <div class="detail_image_remove" onclick="removeDetailImage(${img.id})">×</div>
                `;

                div.addEventListener('dragstart', handleDragStart);
                div.addEventListener('dragover', handleDragOver);
                div.addEventListener('drop', handleDrop);
                div.addEventListener('dragend', handleDragEnd);

                container.appendChild(div);
            });
        }

        function removeDetailImage(id) {
            detailImages = detailImages.filter(img => img.id !== id);
            renderDetailImages();
        }

        function handleDragStart(e) {
            draggedElement = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }

            if (draggedElement !== this) {
                const draggedId = parseInt(draggedElement.dataset.id);
                const targetId = parseInt(this.dataset.id);

                const draggedIndex = detailImages.findIndex(img => img.id === draggedId);
                const targetIndex = detailImages.findIndex(img => img.id === targetId);

                const temp = detailImages[draggedIndex];
                detailImages[draggedIndex] = detailImages[targetIndex];
                detailImages[targetIndex] = temp;

                renderDetailImages();
            }

            return false;
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
        }

        let theaterData = [];

        addEventListener("DOMContentLoaded", () => {
            fetch("/stage/api/selectTheaters", {
                method: "POST"
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error("네트워크 응답이 올바르지 않습니다.");
                    }
                    return response.json();
                })
                .then(data => {
                    theaterData = data;
                })
                .catch(error => console.error("에러 발생:", error));
        });
        const modal = document.getElementById('theaterModal');
        const theaterListUl = document.getElementById('theaterList');
        const theaterSearch = document.getElementById('theaterSearch');

        document.getElementById('selectTheater').addEventListener('click', function() {
            renderTheaterList(theaterData);
            modal.style.display = 'flex';
            theaterSearch.value = '';
            document.body.style.overflow = 'hidden';
        });

        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
            document.getElementById('theaterSearch').value = '';
        }

        function renderTheaterList(data) {
            theaterListUl.innerHTML = '';

            if (data.length === 0) {
                theaterListUl.innerHTML = '<li class="theater_item" style="text-align:center; cursor:default;">검색 결과가 없습니다.</li>';
                return;
            }

            data.forEach(theater => {
                const li = document.createElement('li');
                li.className = 'theater_item';
                li.textContent = theater.name;
                li.setAttribute('data-rel', theater.id)

                li.addEventListener('click', function() {
                    document.getElementById('stageLocation').value = theater.name;
                    document.getElementById('theater_idx').value = theater.id;
                    closeModal();
                });

                theaterListUl.appendChild(li);
            });
        }

        theaterSearch.addEventListener('keyup', function(e) {
            const keyword = e.target.value.toLowerCase();
            const filtered = theaterData.filter(v =>
                v.name.toLowerCase().includes(keyword)
            );
            renderTheaterList(filtered);
        });

        window.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal();
            }
        });

        document.getElementById("okbtn").addEventListener("click", function() {
            const form = document.getElementById("boardform");

            if (!form.stage_name.value) {
                alert("공연 제목을 입력하세요.");
                form.stage_name.focus();
                return;
            }
            if (!form.stage_host.value) {
                alert("공연 주최사를 입력하세요.");
                form.stage_host.focus();
                return;
            }
            if (!form.stage_runtime.value) {
                alert("공연 러닝타임을 입력하세요.");
                form.stage_runtime.focus();
                return;
            }

            if (!form.stage_grade.value) {
                alert("관람 등급을 선택하세요.");
                form.stage_grade.focus();
                return;
            }

            if (!form.poster_file.value) {
                alert("포스터 이미지를 등록하세요.");
                return;
            }

            if(!form.theater_idx.value) {
                alert("공연장을 선택하세요");
                return;
            }

            const formData = new FormData();
            formData.append("stage_name", document.getElementById("stageName").value);
            formData.append("stage_host", document.getElementById("stageHost").value);
            formData.append("stage_runtime", document.getElementById("stageRuntime").value);
            formData.append("stage_grade", document.getElementById("stageGrade").value);
            formData.append("stage_info", document.getElementById("stageInfo").value);
            formData.append("theater_idx", document.getElementById("theater_idx").value);

            const poster = document.getElementById("inp_poster").files[0];
            if (poster) formData.append("poster_file", poster);

            detailImages.forEach(function (item) {
                formData.append("detail_files", item.file);
            });

            fetch("/stage/api/saveStage", {
                method: "POST",
                body: formData
            })
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    if (data.success) {
                        alert(data.message);
                        location.href = "/managestage";
                    } else {
                        alert("실패: " + data.message);
                    }
                })
                .catch(function (err) {
                    console.error(err);
                    alert("통신 오류가 발생했습니다.");
                });
        });
